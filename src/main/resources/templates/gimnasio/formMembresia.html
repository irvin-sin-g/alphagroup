<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Membresía</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        label { display: block; margin-top: 10px; }
        input, select { padding: 6px; width: 300px; }
        button { margin-top: 15px; padding: 8px 15px; background: #28a745;
                 color: white; border: none; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>
    <h1 th:text="${membresia.id == null ? 'Nueva Membresía' : 'Editar Membresía'}"></h1>
    <form th:action="@{/gimnasio/membresias/guardar}" th:object="${membresia}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <label>Tipo:</label>
        <select th:field="*{tipo}">
            <option value="Mensual">Mensual</option>
            <option value="Trimestral">Trimestral</option>
            <option value="Anual">Anual</option>
        </select>
        <label>Fecha Inicio:</label><input type="date" th:field="*{fechaInicio}"/>
        <label>Fecha Fin:</label><input type="date" th:field="*{fechaFin}"/>
        <label>Precio:</label><input type="number" step="0.01" th:field="*{precio}"/>
        <label>Nombre Cliente:</label><input type="text" th:field="*{nombreCliente}"/>
        <button type="submit">Guardar</button>
    </form>
    <br><a href="/gimnasio/membresias">Volver</a>
</body>
</html>
