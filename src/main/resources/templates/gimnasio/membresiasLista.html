<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Membresías</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; }
        th { background: #333; color: white; }
        a.btn { padding: 5px 10px; background: #007bff; color: white;
                text-decoration: none; border-radius: 3px; margin-right: 5px; }
        a.del { background: #dc3545; }
    </style>
</head>
<body>
    <h1>Lista de Membresías</h1>
    <a class="btn" th:href="@{/gimnasio/membresias/nuevo}">+ Nueva Membresía</a>
    <br><br>
    <table>
        <thead>
            <tr><th>ID</th><th>Tipo</th><th>Inicio</th><th>Fin</th>
                <th>Precio</th><th>Cliente</th><th>DNI Cliente</th><th>Acciones</th></tr>
        </thead>
        <tbody>
            <tr th:each="m : ${membresias}">
                <td th:text="${m.id}"></td>
                <td th:text="${m.tipo}"></td>
                <td th:text="${m.fechaInicio}"></td>
                <td th:text="${m.fechaFin}"></td>
                <td th:text="${m.precio}"></td>
                <td th:text="${m.nombreCliente}"></td>
                <td th:text="${m.apellidosCliente}"></td>
                <td>
                    <a class="btn" th:href="@{/gimnasio/membresias/editar/{id}(id=${m.id})}">Editar</a>
                    <a class="btn del" th:href="@{/gimnasio/membresias/eliminar/{id}(id=${m.id})}">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
    <br><a href="/">Volver</a>
</body>
</html>
